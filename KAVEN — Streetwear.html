<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAVEN — Streetwear</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fcfbf9;--fg:#141414;--mut:#6b6a63;--sand:#d8ccb6;--olive:#4f5238;--card:#f1eee8;--line:#e3dfd6;--inv:#141414;--invf:#fcfbf9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font:400 15px/1.5 'Work Sans',system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Archivo,'Helvetica Neue',Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.top{background:var(--inv);color:var(--invf);text-align:center;font-size:13px;padding:6px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-weight:800;letter-spacing:.3em;font-size:22px}
.btn{border:1px solid var(--fg);background:transparent;padding:10px 18px;border-radius:2px;font-weight:500}
.btn.solid{background:var(--inv);color:var(--invf)}
.ib{border:0;background:none;padding:6px 4px;font-weight:500}
.strip{display:flex;gap:22px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line);font-size:14px;color:var(--mut);white-space:nowrap}
.strip a:hover,.strip a.on{color:var(--fg)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.hero{background:#efeeec}.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;align-items:end;gap:20px}.hero .tx{padding:72px 0}.hero img{width:100%;max-height:560px;object-fit:contain;object-position:bottom;mix-blend-mode:multiply}@media(max-width:700px){.hero .wrap{grid-template-columns:1fr}.hero .tx{padding:40px 0 0}.hero img{max-height:380px}}
.hero h1{font-weight:800;font-size:clamp(40px,8vw,92px);line-height:.95;max-width:11ch;margin-bottom:20px}
.hero p{max-width:40ch;color:var(--mut);margin-bottom:24px}
.hero .btn{margin-right:8px}
.mq{background:var(--olive);color:#f2f0ea;overflow:hidden;white-space:nowrap;padding:12px 0;font-family:Archivo,sans-serif;font-weight:500}
.mq div{display:inline-block;padding-left:100%;animation:mq 30s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
@media(prefers-reduced-motion:reduce){.mq div{animation:none;padding-left:20px}}
section{padding:48px 0}
h2{font-size:clamp(26px,4vw,38px);font-weight:800;margin-bottom:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:22px 14px}.tile{text-align:center;font-family:Archivo,sans-serif;font-weight:500}.tile .c{aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--card);margin-bottom:10px;border:1px solid var(--line);transition:transform .2s}.tile:hover .c{transform:scale(1.04)}.tile img,.cat-hero img{width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card h3{font-size:16px;font-weight:500;margin:10px 0 2px}
.card p{font-weight:500;margin-bottom:8px}
.card .row{display:flex;gap:6px}
.card select{border:1px solid var(--line);background:var(--bg);padding:8px;border-radius:2px}
.card .btn{flex:1;padding:8px}
.ph{aspect-ratio:3/4;background:var(--card);border:1px dashed var(--line);display:grid;place-items:center;color:var(--mut);font-size:13px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cat-hero{background:var(--card);padding:36px 0}.cat-hero .wrap{display:flex;align-items:center;gap:18px}.cat-hero .c{width:88px;height:88px;border-radius:50%;overflow:hidden;flex:none}.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}.rv.in{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}.fr{padding:72px 0}.fr p{font-family:Archivo,sans-serif;font-weight:800;font-size:clamp(28px,6vw,64px);line-height:1.05;margin-bottom:.3em}.fr p:nth-child(even){color:var(--mut);text-align:right}
.cat-hero h1{font-size:clamp(34px,6vw,64px);font-weight:800}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:500}
details p{color:var(--mut);margin-top:8px;max-width:60ch}
footer{background:var(--card);border-top:1px solid var(--line);padding:40px 0;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px}
footer h4{font-family:Archivo,sans-serif;margin-bottom:8px}
footer p,footer a{display:block;font-size:14px;opacity:.8;margin-bottom:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
.ov.on{display:block}
.pnl{position:fixed;top:0;bottom:0;width:min(400px,92vw);background:var(--bg);padding:20px;overflow-y:auto;z-index:21;transition:transform .25s}
.pnl.l{left:0;transform:translateX(-100%)}.pnl.r{right:0;transform:translateX(100%)}
.pnl.on{transform:none}
.pnl h3{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.pnl nav a{display:block;padding:12px 0;border-bottom:1px solid var(--line);font-family:Archivo,sans-serif;font-weight:500}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.it small{color:var(--mut);display:block}
.q button{width:26px;height:26px;border:1px solid var(--line);background:none}
.f{display:flex;gap:8px;margin:12px 0 4px}
.f input,.fm input{border:1px solid var(--line);background:var(--bg);padding:9px;border-radius:2px;width:100%}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .t{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.msg{font-size:13px;color:var(--mut)}
.fm{display:grid;gap:10px}
.pay label{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:10px;margin-bottom:8px;border-radius:2px}
.pay input{width:auto}
.mod{position:fixed;inset:0;display:none;place-items:center;z-index:30;background:rgba(0,0,0,.55);padding:16px}
.mod.on{display:grid}
.mod>div{background:var(--bg);padding:24px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
.cb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--inv);color:var(--invf);border:0;padding:12px 18px;border-radius:99px;font-weight:500}.cp{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 32px));height:min(460px,70vh);background:var(--bg);border:1px solid var(--line);display:none;flex-direction:column;z-index:15}.cp.on{display:flex}.cp h4{font-family:Archivo,sans-serif;padding:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.cm{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.bb{max-width:85%;padding:8px 12px;border-radius:12px;font-size:14px}.bb.bot{background:var(--card);align-self:flex-start}.bb.me{background:var(--inv);color:var(--invf);align-self:flex-end}.bb a{text-decoration:underline;display:block;margin-top:4px}.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}.chips button{border:1px solid var(--line);background:none;padding:5px 10px;border-radius:99px;font-size:13px}.cf{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}.cf input{flex:1;border:1px solid var(--line);background:var(--bg);padding:8px;border-radius:2px;min-width:0}
</style>
</head>

acessorios:'Boné Washed Preto|79.9;Relógio Minimal Preto|249.9;Cinto de Couro|99.9;Óculos Preto|129.9'};
const P=[];let id=0;
for(const [k] of CATS)RAW[k].split(';').forEach(s=>{const [n,p]=s.split('|');P.push({id:++id,c:k,n,p:+p,img:IMG[PI[n]]||''})});
const sizes=c=>c==='calcados'?['39','40','41','42','43']:c==='acessorios'?['Único']:['P','M','G','GG'];
const catName=k=>CATS.find(c=>c[0]===k)[1];

let cart=[];try{cart=JSON.parse(localStorage.getItem('kv-cart')||'[]')}catch(e){}
let ship=null,cepV='',numV='',step='cart';
const save=()=>{try{localStorage.setItem('kv-cart',JSON.stringify(cart))}catch(e){}};

const card=p=>`<article class="card"><div class="ph">${p.img?`<img src="${p.img}" alt="${p.n}">`:'<span>Foto do produto</span>'}</div><h3>${p.n}</h3><p>${BRL(p.p)}</p><div class="row"><select id="s${p.id}" aria-label="Tamanho">${sizes(p.c).map(s=>`<option>${s}</option>`).join('')}</select><button class="btn solid" onclick="add(${p.id})">Adicionar</button></div></article>`;

const FAQ=[['Quanto tempo leva a entrega?','O prazo depende da sua região. Confirmamos a data no carrinho depois que você informa o CEP.'],['Como o frete é calculado?','Medimos a distância entre a loja, no centro de São Paulo, e o seu endereço. Cada quilômetro custa R$ 0,25.'],['Posso trocar ou devolver?','Sim. Você tem até 7 dias após o recebimento para pedir troca ou devolução, com a peça sem uso e com etiqueta. Para defeito de fábrica, a garantia é de 30 dias.'],['Quais formas de pagamento vocês aceitam?','Pix com 5% de desconto, cartão de crédito em até 6x sem juros e boleto bancário.'],['Como escolho o tamanho?','Nossas peças têm modelagem ampla. Se prefere um caimento mais justo, escolha um tamanho abaixo.']];

function view(){
  const h=location.hash.slice(1)||'inicio';
  document.querySelectorAll('#strip a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+h));
  let html='';
  if(CATS.some(c=>c[0]===h)){
    html=`<div class="cat-hero"><div class="wrap"><div class="c"><img src="${IMG[CI[h]]}" alt=""></div><h1>${catName(h)}</h1></div></div><section class="rv in"><div class="wrap"><div class="grid">${P.filter(p=>p.c===h).map(card).join('')}</div></div></section>`;
  }else{
    html=`<div class="hero"><div class="wrap"><div class="tx"><h1>Streetwear atemporal</h1><p>Básicos refinados, caimento amplo e cores neutras para usar todo dia.</p><a class="btn solid" href="#camisetas">Ver coleção</a><a class="btn" href="#jaquetas">Jaquetas</a></div><img src="${IMG.hero}" alt="Modelo com camisa listrada e bermuda jeans"></div></div>
<div class="mq"><div>Peças que duram · Preto, areia e oliva · Modelagem ampla · Feito para o dia a dia · Troca em 7 dias · Peças que duram · Preto, areia e oliva · Modelagem ampla ·</div></div>
<section class="rv"><div class="wrap"><h2>Compre por seção</h2><div class="tiles">${CATS.map(c=>`<a class="tile" href="#${c[0]}"><div class="c"><img src="${IMG[CI[c[0]]]}" alt=""></div>${c[1]}</a>`).join('')}</div></div></section>
<section class="rv fr"><div class="wrap"><p>Menos ruído.</p><p>Mais peça.</p></div></section>
<section class="rv"><div class="wrap"><h2>Vitrine</h2><div class="grid">${VIT.map(n=>card(P.find(p=>p.n===n))).join('')}</div></div></section>
<section class="rv fr"><div class="wrap"><p>KAVEN.</p><p>Combina com tudo.</p><p>Feito para o seu dia a dia.</p></div></section>
<section class="rv"><div class="wrap"><h2>Dúvidas frequentes</h2>${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div></section>`;
  }
  $('#app').innerHTML=html;scrollTo(0,0);reveal();
}
function reveal(){const els=document.querySelectorAll('.rv:not(.in)');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}
const links=CATS.map(c=>`<a href="#${c[0]}">${c[1]}</a>`).join('');
$('#strip').innerHTML=`<a href="#inicio">Início</a>`+links;
$('#sidenav').innerHTML=`<a href="#inicio" onclick="closeP()">Início</a>`+CATS.map(c=>`<a href="#${c[0]}" onclick="closeP()">${c[1]}</a>`).join('');
$('#fcats').innerHTML=links;
addEventListener('hashchange',view);

function openP(n){closeP();$('#ov').classList.add('on');$('#'+n).classList.add('on');if(n==='cart'){step='cart';renderCart()}}
function closeP(){$('#ov').classList.remove('on');document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'))}
function add(i){const s=$('#s'+i).value;const f=cart.find(x=>x.id===i&&x.s===s);f?f.q++:cart.push({id:i,s,q:1});ship=null;save();count();openP('cart')}
function chg(ix,d){cart[ix].q+=d;if(cart[ix].q<1)cart.splice(ix,1);ship=null;save();count();renderCart()}
function count(){$('#cnt').textContent=cart.reduce((a,b)=>a+b.q,0)}
const sub=()=>cart.reduce((a,b)=>a+P.find(p=>p.id===b.id).p*b.q,0);

// Troque esta função por uma chamada real ao seu servidor: ViaCEP + API de rotas
// (ex.: Google Distance Matrix, OpenRouteService) a partir do centro de São Paulo.
// Hoje devolve uma estimativa de demonstração baseada no CEP.
async function distanceKm(cep,num){return Math.max(1,Math.round(Math.abs(+cep-1001000)/100000))}

async function calc(){
  cepV=$('#cep').value;numV=$('#num').value;const c=cepV.replace(/\D/g,'');
  if(c.length!==8||!numV){$('#fmsg').textContent='Informe o CEP com 8 números e o número da casa.';return}
  $('#fmsg').textContent='Calculando…';
  const km=await distanceKm(c,numV);ship={km,v:km*KM_PRICE};renderCart();
}
function renderCart(){
  const el=$('#cart');
  if(!cart.length){el.innerHTML=`<h3>Carrinho <button class="ib" onclick="closeP()">Fechar</button></h3><p class="msg">Seu carrinho está vazio. Escolha uma seção no menu.</p>`;return}
  const s=sub(),f=ship?ship.v:0;
  el.innerHTML=`<h3>Carrinho <button class="ib" onclick="closeP()">Fechar</button></h3>
${cart.map((x,i)=>{const p=P.find(p=>p.id===x.id);return `<div class="it"><div>${p.n}<small>Tamanho ${x.s} · ${BRL(p.p)}</small></div><div class="q"><button onclick="chg(${i},-1)" aria-label="Diminuir">−</button> ${x.q} <button onclick="chg(${i},1)" aria-label="Aumentar">+</button></div></div>`}).join('')}
<div class="f"><input id="cep" placeholder="CEP" inputmode="numeric" value="${cepV}" aria-label="CEP"><input id="num" placeholder="Nº" value="${numV}" style="max-width:80px" aria-label="Número"><button class="btn" onclick="calc()">Calcular</button></div>
<p class="msg" id="fmsg">${ship?`Distância estimada: ${ship.km} km × R$ 0,25`:'Informe o endereço para ver o frete.'}</p>
<div class="sum" style="margin:14px 0"><div><span>Subtotal</span><span>${BRL(s)}</span></div><div><span>Frete</span><span>${ship?BRL(f):'—'}</span></div><div class="t"><span>Total</span><span>${BRL(s+f)}</span></div></div>
<button class="btn solid" style="width:100%" onclick="checkout()">Ir para o pagamento</button>`;
}
function checkout(){
  if(!ship){$('#fmsg').textContent='Calcule o frete antes de continuar.';return}
  const s=sub(),f=ship.v;
  $('#modc').innerHTML=`<h3 style="font-size:22px;margin-bottom:14px">Pagamento</h3>
<div class="fm"><input id="nm" placeholder="Nome completo" aria-label="Nome"><input id="em" type="email" placeholder="E-mail" aria-label="E-mail"><input id="rua" placeholder="Rua, complemento e bairro" aria-label="Endereço"></div>
<div class="pay" style="margin:14px 0"><label><input type="radio" name="pg" value="pix" checked onchange="tot()">Pix · 5% de desconto</label><label><input type="radio" name="pg" value="cartao" onchange="tot()">Cartão de crédito · até 6x sem juros</label><label><input type="radio" name="pg" value="boleto" onchange="tot()">Boleto bancário</label></div>
<div class="sum" id="tot"></div>
<p class="msg" id="pm"></p>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="$('#mod').classList.remove('on')">Voltar</button><button class="btn solid" style="flex:1" onclick="pay()">Confirmar pedido</button></div>`;
  $('#mod').classList.add('on');tot();
}
function tot(){
  const pg=document.querySelector('input[name=pg]:checked').value,s=sub(),f=ship.v,d=pg==='pix'?s*.05:0,t=s-d+f;
  $('#tot').innerHTML=`<div><span>Subtotal</span><span>${BRL(s)}</span></div>${d?`<div><span>Desconto Pix</span><span>−${BRL(d)}</span></div>`:''}<div><span>Frete</span><span>${BRL(f)}</span></div><div class="t"><span>Total</span><span>${BRL(t)}</span></div>${pg==='cartao'?`<div class="msg"><span>6x de ${BRL(t/6)}</span></div>`:''}`;
}
function pay(){
  if(!$('#nm').value||!$('#em').value||!$('#rua').value){$('#pm').textContent='Preencha nome, e-mail e endereço.';return}
  // Aqui entra o gateway de pagamento (Mercado Pago, Stripe, Pagar.me...).
  $('#modc').innerHTML=`<h3 style="font-size:22px;margin-bottom:10px">Pedido recebido</h3><p>Obrigado, ${$('#nm').value.split(' ')[0]}. Enviamos os detalhes para ${$('#em').value}.</p><p class="msg" style="margin:10px 0">Modo demonstração: nenhum pagamento foi cobrado.</p><button class="btn solid" onclick="done()">Continuar comprando</button>`;
}
function done(){cart=[];ship=null;save();count();$('#mod').classList.remove('on');closeP()}
// Troque pelo número (com 55 e DDD, só dígitos) e pelo e-mail reais da loja.
const WA='5511999999999',MAIL='contato@suamarca.com.br';
const KB=[
[['frete','entrega','prazo','envio','cep','enviam','chega'],'O frete é calculado pela distância entre a nossa loja, no centro de São Paulo, e o seu endereço: R$ 0,25 por km. Informe CEP e número no carrinho para ver o valor.'],
[['pagamento','pagar','pix','cartao','boleto','parcela','parcelar','credito'],'Aceitamos Pix com 5% de desconto, cartão de crédito em até 6x sem juros e boleto bancário.'],
[['desconto','promocao','cupom','oferta'],'Pagando com Pix você ganha 5% de desconto no valor dos produtos.'],
[['troca','trocar','devolucao','devolver','reembolso'],'Você tem até 7 dias após o recebimento para pedir troca ou devolução, com a peça sem uso e com etiqueta. Para defeito de fábrica, a garantia é de 30 dias.'],
[['tamanho','medida','caimento','modelagem','veste','numero','pp','gg'],'Roupas: P, M, G e GG. Calçados: 39 a 43. Acessórios: tamanho único. Nossas peças têm modelagem ampla; para um caimento mais justo, escolha um tamanho abaixo.'],
[['produto','secao','secoes','camiseta','camisa','moletom','calca','bermuda','jaqueta','calcado','tenis','acessorio','bone','oculos','catalogo'],'Temos Camisetas, Camisas, Moletons, Calças, Bermudas, Jaquetas, Calçados e Acessórios. Escolha uma seção no menu ou na faixa abaixo do topo.'],
[['loja','endereco','onde','fisica','localizacao'],'Nossa loja fica no centro de São Paulo.'],
[['horario','atendimento','funciona'],'Atendemos de segunda a sexta, das 9h às 18h.'],
[['oi','ola','bom dia','boa tarde','boa noite'],'Olá! Posso ajudar com frete, pagamento, trocas e tamanhos.']];
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function say(t,who,html){const d=document.createElement('div');d.className='bb '+who;html?d.innerHTML=t:d.textContent=t;$('#cm').appendChild(d);$('#cm').scrollTop=1e9}
function INSTR(){
  const sec=CATS.map(c=>c[1]+' (tamanhos: '+sizes(c[0]).join(', ')+'): '+P.filter(p=>p.c===c[0]).map(p=>p.n+' '+BRL(p.p)).join('; ')).join('\n');
  return 'Você é o assistente de atendimento da loja de streetwear KAVEN. Responda em português do Brasil, em no máximo 3 frases curtas, usando só as informações abaixo. Se a resposta não estiver nelas, ou se for sobre um pedido específico, responda somente [CONTATO]. Não invente preços, prazos ou políticas.\n\nINFORMAÇÕES:\n- Loja no centro de São Paulo. Atendimento de segunda a sexta, das 9h às 18h.\n- Frete: R$ 0,25 por km entre a loja e o endereço do cliente; o cliente informa CEP e número no carrinho.\n- Pagamento: Pix com 5% de desconto, cartão de crédito em até 6x sem juros e boleto.\n- Trocas e devoluções: até 7 dias após o recebimento, com a peça sem uso e com etiqueta. Garantia de 30 dias para defeitos de fábrica.\n- Modelagem ampla; para um caimento mais justo, um tamanho abaixo.\n- Seções, tamanhos e produtos:\n'+sec;
}
let AI,hist=[];
async function reply(q){
  try{if(AI===undefined)AI=(window.claude&&await claude.use('sample'))||null}catch(e){AI=null}
  if(!AI)return kw(q);
  const d=document.createElement('div');d.className='bb bot';d.textContent='Digitando…';$('#cm').appendChild(d);$('#cm').scrollTop=1e9;
  try{
    const r=await AI(INSTR()+'\n\nConversa até agora:\n'+hist.slice(-6).join('\n')+'\nCliente: '+q+'\nAssistente:',{cache:false,modelTier:'quick'});
    d.remove();const t=(r.text||'').trim();hist.push('Cliente: '+q);
    if(!t||t.includes('[CONTATO]')){hist.push('Assistente: (encaminhou para contato)');return contact(q)}
    hist.push('Assistente: '+t);say(t,'bot');
  }catch(e){d.remove();kw(q)}
}
function kw(q){
  const w=norm(q).split(/[^a-z0-9]+/),n=' '+w.join(' ')+' ';let best=null,sc=0;
  for(const [ks,a] of KB){const s=ks.filter(k=>k.includes(' ')?n.includes(' '+k+' '):w.includes(k)).length;if(s>sc){sc=s;best=a}}
  if(best)return say(best,'bot');
  contact(q)}
function contact(q){
  const m=encodeURIComponent('Olá! Tenho uma dúvida: '+q);
  say('Não sei responder isso por aqui. Fale com a gente:<a href="https://wa.me/'+WA+'?text='+m+'" target="_blank" rel="noopener">WhatsApp</a><a href="mailto:'+MAIL+'?subject='+encodeURIComponent('Dúvida')+'&body='+m+'">E-mail: '+MAIL+'</a>','bot',true);
}
function ask(e){e.preventDefault();const v=$('#ci').value.trim();if(!v)return false;say(v,'me');$('#ci').value='';reply(v);return false}
function chat(){const p=$('#cp');p.classList.toggle('on');if(p.classList.contains('on')&&!$('#cm').children.length){say('Olá! Sou o assistente da KAVEN. Sobre o que você quer saber?','bot');$('#chips').innerHTML=['Frete','Pagamento','Trocas','Tamanhos'].map(c=>`<button onclick="say('${c}','me');reply('${c}')">${c}</button>`).join('');$('#ci').focus()}}
count();view();
</script>
